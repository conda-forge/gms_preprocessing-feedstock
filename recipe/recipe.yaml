schema_version: 1

context:
  name: gms_preprocessing
  version: "0.19.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gms_preprocessing-${{ version }}.tar.gz
  sha256: f475dafa830cd6821522a8bbb84594e4c0e809b3b09089c27a924e82c8682d33

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - arosics >=1.0.0
    - cerberus
    - dill
    - ephem
    - gdal
    - geoalchemy2
    - geoarray >=0.9.0
    - geopandas
    - iso8601
    - jsmin
    - matplotlib-base
    - natsort
    - nested_dict
    - numpy
    - openpyxl
    - pandas
    - psutil
    - psycopg2
    - py-tools-ds >=0.16.2
    - pyhdf
    - pyinstrument
    - pyorbital
    - pyproj
    - pyrsr >=0.3.1
    - python >=${{ python_min }}
    - python-fmask
    - pytz
    - redis-py  # named redis on PyPI and redis-py on conda-forge; importable as 'redis'
    - redis-semaphore
    - retools
    - scikit-learn
    - scipy
    - shapely
    - sicor
    - spechomo
    - spectral >=0.16
    - sqlalchemy
    - timeout-decorator
    - tqdm

tests:
  - python:
      imports:
        - gms_preprocessing
        - gms_preprocessing.algorithms
        - gms_preprocessing.io
        - gms_preprocessing.misc
        - gms_preprocessing.model
        - gms_preprocessing.options
        - gms_preprocessing.processing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: GeoMultiSens - Scalable Multi-Sensor Analysis of Remote Sensing Data
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://gitext.gfz-potsdam.de/geomultisens/gms_preprocessing

extra:
  recipe-maintainers:
    - danschef
